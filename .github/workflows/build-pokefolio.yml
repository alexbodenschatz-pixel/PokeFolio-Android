name: Build PokeFolio Android APK v0.6.4.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore PokeFolio v0.6.4.2 project
        shell: bash
        run: |
          rm -rf generated-app
          mkdir generated-app
          echo '' | base64 -d > /tmp/pokefolio-src.tar.gz
          tar -xzf /tmp/pokefolio-src.tar.gz -C generated-app

      - name: Enable AndroidX
        working-directory: generated-app
        shell: bash
        run: |
          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        id: buildapk
        working-directory: generated-app
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain 2>&1 | tee ../build.log
          CODE=${PIPESTATUS[0]}
          echo "### PokéFolio Build-Diagnose" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            grep -E -B2 -A8 "(^.*error:|FAILURE:|What went wrong:|Execution failed for task|Could not resolve|Could not find|A problem occurred|Caused by:)" ../build.log | tail -n 160 >> "$GITHUB_STEP_SUMMARY" || tail -n 160 ../build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$CODE"

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: PokeFolio-v0.6.4.2-BUILD-LOG
          path: build.log
          if-no-files-found: warn

      - name: Verify APK
        if: success()
        shell: bash
        run: |
          APK="generated-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "=== APK BADGING ==="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -25
          echo "=== APK SIGNATURE ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          echo "=== APK SHA256 ==="
          sha256sum "$APK" | tee PokeFolio-v0.6.4.2-debug.sha256
          cp "$APK" PokeFolio-v0.6.4.2-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PokeFolio-v0.6.4.2-APK
          path: |
            PokeFolio-v0.6.4.2-debug.apk
            PokeFolio-v0.6.4.2-debug.sha256
          if-no-files-found: error

      - name: Create GitHub prerelease
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="pokefolio-v0.6.4.2-build-${{ github.run_number }}"
          TITLE="PokéFolio v0.6.4.2 – Build ${{ github.run_number }}"
          NOTES="Automatisch erstellte Android-Testversion von PokéFolio v0.6.4.2. Enthält APK und SHA-256-Prüfsumme."

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
          fi

          gh release create "$TAG" \
            "PokeFolio-v0.6.4.2-debug.apk" \
            "PokeFolio-v0.6.4.2-debug.sha256" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --prerelease

