name: Build PokeFolio Android and Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test recognition logic
        run: node --test tests/*.test.js

      - name: Build and test debug app
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --console=plain

      - name: Verify debug APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -25
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeFolio-Android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test shared JavaScript core
        shell: pwsh
        run: node --test tests/*.test.js

      - name: Restore Windows solution
        shell: pwsh
        run: dotnet restore windows/PokeFolio.Desktop.sln

      - name: Build Windows desktop host
        shell: pwsh
        run: dotnet build windows/PokeFolio.Desktop.sln -c Release --no-restore

      - name: Test Windows bridge and capture abstractions
        shell: pwsh
        run: dotnet test windows/PokeFolio.Desktop.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Validate packaged shared assets
        shell: pwsh
        run: dotnet run --project windows/PokeFolio.Desktop/PokeFolio.Desktop.csproj -c Release --no-build -- --self-test

      - name: Publish Windows desktop foundation
        shell: pwsh
        run: dotnet publish windows/PokeFolio.Desktop/PokeFolio.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o windows/artifacts/PokeFolio-Desktop

      - name: Upload Windows desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: PokeFolio-Windows-desktop-foundation
          path: windows/artifacts/PokeFolio-Desktop
          if-no-files-found: error
          retention-days: 30
