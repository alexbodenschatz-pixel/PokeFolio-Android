name: Build PokeFolio Android APK v0.6.4.1

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Restore PokeFolio v0.6.4.1 project
        shell: bash
        run: |
          rm -rf generated-app
          mkdir generated-app
          echo '' | base64 -d > /tmp/pokefolio-src.tar.gz
          tar -xzf /tmp/pokefolio-src.tar.gz -C generated-app

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: generated-app
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="generated-app/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "=== APK BADGING ==="
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | head -25
          echo "=== APK SIGNATURE ==="
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs "$APK"
          echo "=== APK SHA256 ==="
          sha256sum "$APK" | tee PokeFolio-v0.6.4.1-debug.sha256
          cp "$APK" PokeFolio-v0.6.4.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PokeFolio-v0.6.4.1-APK
          path: |
            PokeFolio-v0.6.4.1-debug.apk
            PokeFolio-v0.6.4.1-debug.sha256
          if-no-files-found: error
