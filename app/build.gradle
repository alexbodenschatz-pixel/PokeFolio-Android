plugins {
    id 'com.android.application'
}

android {
    namespace 'de.pokefolio.app'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'app.pokefolio.mobile'
        minSdk 29
        targetSdk 36
        versionCode 25
        versionName '0.14.0'
        testInstrumentationRunner 'de.pokefolio.app.CardCropInstrumentation'
    }

    signingConfigs {
        testRelease {
            storeFile file('../pokefolio-test.keystore')
            storePassword 'pokefolio-test'
            keyAlias 'pokefolio-test'
            keyPassword 'pokefolio-test'
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
            enableV4Signing true
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.testRelease
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    def camerax_version = '1.6.1'
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'com.google.guava:guava:33.6.0-android'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-japanese:16.0.1'
    implementation 'com.google.mlkit:text-recognition-korean:16.0.1'

    testImplementation 'junit:junit:4.13.2'
}
